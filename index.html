<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High School GPA Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>GPA Calculator</h1>
        <form id="class-form">
            <div class="form-row">
                <label for="grade">Grade (%) or 4.0</label>
                <input type="number" step="0.01" id="grade" required />
            </div>
            <div class="form-row">
                <label for="credit">Credit Hours</label>
                <input type="number" step="0.25" id="credit" required />
            </div>
            <div class="form-row radio-group">
                <label>Type</label>
                <label><input type="radio" name="weight" value="unweighted" checked /> Unweighted</label>
                <label><input type="radio" name="weight" value="weighted" /> Weighted (AP/IB)</label>
            </div>
            <div class="buttons">
                <button type="button" id="add-class">Add Class</button>
                <button type="button" id="clear-all">Clear All</button>
            </div>
        </form>

        <table id="class-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Grade</th>
                    <th>Credit</th>
                    <th>Weighted</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="result">
            <button id="calculate">Calculate GPA</button>
            <p id="gpa-output"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
