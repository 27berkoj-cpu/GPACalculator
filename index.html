<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High School GPA Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <!-- use calculator image as favicon/logo -->
    <link rel="icon" href="images/pngtree-sleek-calculator-design-for-everyday-use-vector-png-image_15431765.png" type="image/png" />
</head>

<body>
    <!-- Main app container -->
    <div class="container">
        <h1>High School GPA Calculator</h1>
        <div class="mode-switch">
            <label><input type="checkbox" id="dark-toggle" aria-label="Toggle dark mode" /> Dark mode</label>
        </div>
        <!-- <img src = "images/pngtree-sleek-calculator-design-for-everyday-use-vector-png-image_15431765.png" alt="Calculator illustration" class="calculator-image" /> -->
        <!-- Semester/year selector and controls -->
        <div class="semester-select">
            <label for="semester">Semester/Year</label>
            <select id="semester"></select>
            <button type="button" id="new-semester">New</button>
            <button type="button" id="delete-semester">Delete</button>
        </div>
        <form id="class-form">
            <div class="form-row">
                <label for="classname">Class Name</label>
                <input type="text" id="classname" required placeholder="e.g. Biology" />
            </div>
            <div class="form-row">
                <label for="grade">Grade (percentage)</label>
                <input type="number" step="0.01" id="grade" min="0" max="100" required placeholder="0-100" />
            </div>
            <div class="form-row">
                <label for="credit">Credits</label>
                <input type="number" step="0.25" id="credit" min="0.25" required placeholder="Credit hours" />
            </div>
            <div class="form-row">
                <label for="type">Course Type</label>
                <select id="type">
                    <option value="regular">Regular</option>
                    <option value="honors">Honors/IB SL</option>
                    <option value="ap">AP/IB HL</option>
                    <option value="ccp">CCP (College Credit Plus / Dual Enrollment)</option>
                </select>
            </div>
            <div class="buttons">
                <button type="submit" id="add-class" aria-label="Add class entry">Add Class</button>
                <button type="button" id="clear-all" aria-label="Clear all classes">Clear All</button>
            </div>
        </form>

        <table id="class-table" aria-label="List of entered classes">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Class</th>
                    <th>Grade (%)</th>
                    <th>Letter</th>
                    <th>Points</th>
                    <th>Credits</th>
                    <th>Type</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Output section for GPA results and conversion info -->
        <div class="result">
            <button id="calculate" disabled aria-label="Calculate GPA">Calculate GPA</button>
            <button id="sample-btn" type="button" aria-label="Show sample classes">Show Sample</button>
            <div class="summary">
                <p id="summary-output" aria-live="polite"></p>
            </div>
            <p id="gpa-output" aria-live="polite"></p>
            <p id="unweighted-output" aria-live="polite"></p>
            <div id="scale-info">
                <h3>Conversion tables</h3>
                <pre id="percentage-to-letter"></pre>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
