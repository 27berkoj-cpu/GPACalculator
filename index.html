<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High School GPA Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>GPA Calculator</h1>
        <div class="mode-switch">
            <label><input type="checkbox" id="dark-toggle" aria-label="Toggle dark mode" /> Dark mode</label>
        </div>
        <div class="semester-select">
            <label for="semester">Semester/Year</label>
            <select id="semester"></select>
            <button type="button" id="new-semester">New…</button>
        </div>
        <form id="class-form">
            <div class="form-row">
                <label for="classname">Class Name</label>
                <input type="text" id="classname" required />
            </div>
            <div class="form-row">
                <label for="grade">Grade (percentage)</label>
                <input type="number" step="0.01" id="grade" min="0" max="100" required />
            </div>
            <div class="form-row">
                <label for="credit">Credits</label>
                <input type="number" step="0.25" id="credit" required />
            </div>
            <div class="form-row">
                <label for="type">Course Type</label>
                <select id="type">
                    <option value="regular">Regular</option>
                    <option value="honors">Honors/IB SL</option>
                    <option value="ap">AP/IB HL</option>
                    <option value="ccp">CCP (College Credit Plus / Dual Enrollment)</option>
                </select>
            </div>
            <div class="buttons">
                <button type="button" id="add-class" aria-label="Add class entry">Add Class</button>
                <button type="button" id="clear-all" aria-label="Clear all classes">Clear All</button>
            </div>
        </form>

        <table id="class-table" aria-label="List of entered classes">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Class</th>
                    <th>Grade (%)</th>
                    <th>Letter</th>
                    <th>Points</th>
                    <th>Credits</th>
                    <th>Type</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="result">
            <button id="calculate" disabled aria-label="Calculate GPA">Calculate GPA</button>
            <button id="export" type="button" aria-label="Export classes as CSV">Export CSV</button>
            <p id="gpa-output"></p>
            <p id="unweighted-output"></p>
            <div id="scale-info">
                <h3>Conversion tables</h3>
                <pre id="percentage-to-letter"></pre>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
